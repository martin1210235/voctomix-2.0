; voctocore overrides for the paper Figure 3 screenshot.
; Passed with -i so the repository defaults stay untouched.
;
; Rationale: the published figure must not contain identifiable persons
; (MDPI research-ethics policy). All camera feeds therefore render the
; Big Buck Bunny open test sequence (Blender Foundation, CC BY 3.0),
; which contains no people, instead of conference recordings.

[mix]
videocaps = video/x-raw,format=I420,width=1920,height=1080,framerate=25/1,pixel-aspect-ratio=1/1,interlace-mode=progressive,colorimetry=bt709

[previews]
enabled = true
videocaps = video/x-raw,width=1024,height=576,framerate=25/1

[overlay]
default-text1 = Live Broadcast
default-text2 = Camera Feed 01
; Keep the lower third on screen: the default behaviour clears it on every cut,
; which would leave the figure without the overlay it is meant to illustrate.
auto-off = false

[mainwindow]
forcefullscreen = true
