# Latency-test override (Análisis 2.1 and 2.2).
# Replaces the camera sources with SOLID full-frame colours so switch/composite
# changes are detected frame-accurately and unambiguously. Switching latency is
# content-independent, so solid colours are a valid (and cleaner) test signal.
#   cam1=red  cam2=green  cam3=blue  cam4=yellow
# bt709 colorimetry forced to match voctocore's configured source caps.
#
# Launch:  docker compose -f docker-compose.yml -f docker-compose.latency.yml up -d
# Use docker-compose.experiment.yml (BBB + markers) for Análisis 1 and 3 instead.

services:
  cam1:
    command:
      - sh
      - -c
      - >-
        ffmpeg -y -nostdin
        -f lavfi -i "color=c=0xFF0000:s=$${WIDTH}x$${HEIGHT}:r=$$FRAMERATE"
        -f lavfi -i "anullsrc=r=$$AUDIORATE:cl=stereo"
        -filter_complex "[0:v] format=yuv420p,setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709 [v]; [1:a] aresample=$$AUDIORATE [a]"
        -map "[v]" -map "[a]"
        -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv
        -pix_fmt yuv420p -c:v rawvideo -c:a pcm_s16le
        -f matroska tcp://localhost:10000

  cam2:
    command:
      - sh
      - -c
      - >-
        ffmpeg -y -nostdin
        -f lavfi -i "color=c=0x00FF00:s=$${WIDTH}x$${HEIGHT}:r=$$FRAMERATE"
        -f lavfi -i "anullsrc=r=$$AUDIORATE:cl=stereo"
        -filter_complex "[0:v] format=yuv420p,setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709 [v]; [1:a] aresample=$$AUDIORATE [a]"
        -map "[v]" -map "[a]"
        -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv
        -pix_fmt yuv420p -c:v rawvideo -c:a pcm_s16le
        -f matroska tcp://localhost:10001

  cam3:
    command:
      - sh
      - -c
      - >-
        ffmpeg -y -nostdin
        -f lavfi -i "color=c=0x0000FF:s=$${WIDTH}x$${HEIGHT}:r=$$FRAMERATE"
        -f lavfi -i "anullsrc=r=$$AUDIORATE:cl=stereo"
        -filter_complex "[0:v] format=yuv420p,setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709 [v]; [1:a] aresample=$$AUDIORATE [a]"
        -map "[v]" -map "[a]"
        -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv
        -pix_fmt yuv420p -c:v rawvideo -c:a pcm_s16le
        -f matroska tcp://localhost:10002

  cam4:
    command:
      - sh
      - -c
      - >-
        ffmpeg -y -nostdin
        -f lavfi -i "color=c=0xFFFF00:s=$${WIDTH}x$${HEIGHT}:r=$$FRAMERATE"
        -f lavfi -i "anullsrc=r=$$AUDIORATE:cl=stereo"
        -filter_complex "[0:v] format=yuv420p,setparams=color_primaries=bt709:color_trc=bt709:colorspace=bt709 [v]; [1:a] aresample=$$AUDIORATE [a]"
        -map "[v]" -map "[a]"
        -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv
        -pix_fmt yuv420p -c:v rawvideo -c:a pcm_s16le
        -f matroska tcp://localhost:10003
