# Minimal pod that keeps the voctomix-voctocore:latest image ALWAYS in use, so
# k3s's image garbage collector never removes it (it only removes unused images).
# Lives in the 'default' namespace (the test matrix never tears that down), so it
# survives every teardown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-keepalive
  namespace: default
  labels:
    app: image-keepalive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-keepalive
  template:
    metadata:
      labels:
        app: image-keepalive
    spec:
      containers:
        - name: keepalive
          image: voctomix-voctocore:latest
          imagePullPolicy: Never
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
