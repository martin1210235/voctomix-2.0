apiVersion: apps/v1
kind: Deployment
metadata:
  name: voctocore
  namespace: voctomix-exp
  labels:
    app: voctocore
    role: core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: voctocore
  template:
    metadata:
      labels:
        app: voctocore
        role: core
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: voctocore
          image: voctomix-voctocore:latest
          imagePullPolicy: Never
          command: ["python3", "voctocore.py"]
          workingDir: /opt/voctomix/voctocore
          readinessProbe:
            exec:
              command: ["bash", "-c", "echo '' | nc -zw1 localhost 9999"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: config
              mountPath: /opt/voctomix/voctocore/default-config.ini
              subPath: default-config.ini
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: voctocore-config
